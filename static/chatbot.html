<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emotional Support Chatbot</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; gap: 20px; padding: 20px; }
    #chatbot, #admin { border: 1px solid #ccc; padding: 12px; width: 400px;
      height: 500px; display: flex; flex-direction: column; }
    #chatMessages { flex: 1; overflow-y: auto; border: 1px solid #eee;
      padding: 8px; margin-bottom: 10px; }
    .message { margin: 8px 0; overflow-wrap: anywhere; }
    .user { text-align: right; color: #245baf; }
    .bot { text-align: left; color: #218049; }
    #inputArea { display: flex; gap: 5px; }
    #userInput { flex: 1; min-width: 0; padding: 8px; }
    #sendBtn { padding: 8px 12px; }
    .note { font-size: 12px; color: #666; }
    @media (max-width: 850px) {
      body { flex-direction: column; }
      #chatbot, #admin { width: auto; }
    }
  </style>
</head>
<body>
  <section id="chatbot">
    <h3>Emotional Support Chatbot</h3>
    <div id="chatMessages" role="log" aria-live="polite"></div>
    <div id="inputArea">
      <input id="userInput" type="text" maxlength="2000"
             placeholder="Type your message...">
      <button id="sendBtn">Send</button>
    </div>
    <p class="note">Student project. Not medical advice or an emergency service.</p>
  </section>
  <section id="admin">
    <h3>Admin Dashboard</h3>
    <p><b>Active users (last 24 hours):</b> <span id="activeUsers">Loading...</span></p>
    <canvas id="sentimentChart"></canvas>
    <p class="note">Hourly average message sentiment: -1 = negative, 0 = neutral, +1 = positive.
      This is not a mental-health assessment.</p>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const activeUsers = document.getElementById('activeUsers');
    const ctx = document.getElementById('sentimentChart').getContext('2d');
    let userId = localStorage.getItem('user_id');
    if (!userId) {
      userId = 'user_' + Math.random().toString(36).slice(2);
      localStorage.setItem('user_id', userId);
    }

    function addMessage(sender, text, sentimentScore, modelUsed) {
      const div = document.createElement('div');
      div.className = 'message ' + sender;
      const label = document.createElement('b');
      label.textContent = sender === 'user' ? 'You: ' : 'Bot: ';
      div.appendChild(label);
      div.appendChild(document.createTextNode(text));
      if (typeof sentimentScore === 'number') {
        const note = document.createElement('small');
        note.textContent = ' (Sentiment: ' + sentimentScore.toFixed(2) + ')';
        div.appendChild(note);
      }
      if (sender === 'bot' && modelUsed === 'dialogpt_fallback') {
        const note = document.createElement('small');
        note.textContent = ' (Offline DialoGPT fallback: responses may be unreliable)';
        div.appendChild(note);
      }
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;
      userInput.value = '';
      addMessage('user', message);
      sendBtn.disabled = true;
      try {
        const res = await fetch('/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({user_id: userId, message})
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Chat request failed');
        addMessage('bot', data.reply, data.sentiment_score, data.model_used);
        loadAdminStats();
      } catch (error) {
        addMessage('bot', 'Unable to send message: ' + error.message);
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') sendMessage();
    });

    let sentimentChart;
    async function loadAdminStats() {
      try {
        const res = await fetch('/admin/stats');
        if (!res.ok) throw new Error('Stats not available');
        const data = await res.json();
        activeUsers.textContent = data.total_active_users;
        if (sentimentChart) sentimentChart.destroy();
        sentimentChart = new Chart(ctx, {
          type: 'line',
          data: { labels: data.sentiment_trend.dates, datasets: [{
            label: 'Average sentiment (last 24h)',
            data: data.sentiment_trend.avg_scores,
            borderColor: '#23729b', fill: false, tension: 0.2
          }]},
          options: { scales: { y: { min: -1, max: 1 } } }
        });
      } catch (error) {
        activeUsers.textContent = 'Unavailable';
      }
    }
    loadAdminStats();
    setInterval(loadAdminStats, 5 * 60 * 1000);
  </script>
</body>
</html>
